<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生日快乐 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      overflow: hidden;
      position: relative;
    }

    /* 飘落的彩带/星星 */
    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .confetti span {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffd700;
      animation: fall linear infinite;
    }

    .confetti span:nth-child(1) { left: 10%; animation-duration: 4s; animation-delay: 0s; background: #ff6b9d; }
    .confetti span:nth-child(2) { left: 20%; animation-duration: 5s; animation-delay: 0.5s; background: #c44569; }
    .confetti span:nth-child(3) { left: 30%; animation-duration: 4.5s; animation-delay: 1s; background: #ffd93d; }
    .confetti span:nth-child(4) { left: 40%; animation-duration: 5.5s; animation-delay: 0.2s; background: #6bcb77; }
    .confetti span:nth-child(5) { left: 50%; animation-duration: 4s; animation-delay: 1.5s; background: #4d96ff; }
    .confetti span:nth-child(6) { left: 60%; animation-duration: 5s; animation-delay: 0.8s; background: #ff9f43; }
    .confetti span:nth-child(7) { left: 70%; animation-duration: 4.2s; animation-delay: 0.3s; background: #a55eea; }
    .confetti span:nth-child(8) { left: 80%; animation-duration: 5.2s; animation-delay: 1.2s; background: #26de81; }
    .confetti span:nth-child(9) { left: 90%; animation-duration: 4.8s; animation-delay: 0.6s; background: #fd9644; }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0.3;
      }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 4rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 420px;
      animation: cardIn 0.8s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cake {
      font-size: 4rem;
      margin-bottom: 0.5rem;
      animation: bounce 1.5s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 2.2rem;
      color: #2d3436;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e84393, #6c5ce7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .name {
      font-size: 1.5rem;
      color: #636e72;
      margin-bottom: 1.5rem;
    }

    .name input {
      font-family: inherit;
      font-size: 1.3rem;
      border: 2px solid #dfe6e9;
      border-radius: 12px;
      padding: 0.4rem 1rem;
      text-align: center;
      width: 100%;
      max-width: 200px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .name input:focus {
      outline: none;
      border-color: #a55eea;
      box-shadow: 0 0 0 3px rgba(165, 94, 234, 0.2);
    }

    .wish {
      font-size: 1.15rem;
      line-height: 1.8;
      color: #636e72;
    }

    .hearts {
      margin-top: 1.5rem;
      font-size: 1.8rem;
      letter-spacing: 0.5rem;
    }

    .hearts span {
      display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }

    .hearts span:nth-child(1) { animation-delay: 0s; }
    .hearts span:nth-child(2) { animation-delay: 0.2s; }
    .hearts span:nth-child(3) { animation-delay: 0.4s; }
    .hearts span:nth-child(4) { animation-delay: 0.6s; }
    .hearts span:nth-child(5) { animation-delay: 0.8s; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="confetti">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="card">
    <div class="cake">🎂</div>
    <h1>生日快乐</h1>
    <p class="name">
      送给：<input type="text" id="nameInput" placeholder="输入名字" value="">
    </p>
    <p class="wish" id="wishText">
      愿你新的一岁里，心想事成、笑口常开，
      身边永远有爱与温暖相伴。生日快乐！
    </p>
    <div class="hearts">
      <span>❤️</span><span>💖</span><span>❤️</span><span>💖</span><span>❤️</span>
    </div>
  </div>

  <script>
    const nameInput = document.getElementById('nameInput');
    const wishText = document.getElementById('wishText');

    nameInput.addEventListener('input', function() {
      const name = this.value.trim();
      if (name) {
        wishText.textContent = `亲爱的${name}，愿你新的一岁里心想事成、笑口常开，身边永远有爱与温暖相伴。生日快乐！`;
      } else {
        wishText.textContent = '愿你新的一岁里，心想事成、笑口常开，身边永远有爱与温暖相伴。生日快乐！';
      }
    });
  </script>
</body>
</html>
