<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小屋探索</title>
  <!-- 本地字体：font 文件夹 -->
  <style>
    @font-face {
      font-family: 'Ma Shan Zheng';
      src: url('font/MaShanZheng-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Zhi Mang Xing';
      src: url('font/ZhiMangXing-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'ZCOOL KuaiLe';
      src: url('font/ZCOOLKuaiLe-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /*
      虚线框位置与大小：只改下面 :root 里的 --door-* / --env-* 即可生效。
      保存后若未变化请强制刷新（Ctrl+F5 或 Cmd+Shift+R）。百分比相对于背景图容器。
    */
    :root {
      --card: #fffefc;
      --accent: #e8b4b8;
      --accent-deep: #d4a0a5;
      --text: #4a4541;
      --text-soft: #7a756f;
      --shadow: rgba(80, 60, 90, 0.2);
      --radius: 20px;
      /* 信封虚线框：top/left 位置，width/height 大小（% 或 px） */
      --env-top: 85%;
      --env-left: 33%;
      --env-width: 15%;
      --env-height: 9%;
      /* 门口虚线框：top/left 位置，width/height 大小（% 或 px） */
      --door-top: 38%;
      --door-left: 37%;
      --door-width: 12%;
      --door-height: 43%;
    }

    html {
      font-size: clamp(14px, 2.2vw, 18px);
      -webkit-tap-highlight-color: transparent;
    }

    /* ========== 背景：同目录 bg.jpg + 虚化 ========== */
    body {
      min-height: 100vh;
      font-family: 'ZCOOL KuaiLe', cursive;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20px;
      z-index: -2;
      background: url('bg.jpg') center center / cover no-repeat;
      filter: blur(10px);
      transform: scale(1.08);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.25);
      pointer-events: none;
    }

    /* 展开信件时使用 bg2.jpg 虚化背景 */
    body.bg2-blur::before {
      background-image: url('bg2.jpg');
      filter: blur(12px);
      transform: scale(1.08);
    }

    /* 左上角标识：初始页与信件页均显示 */
    .logo-wrap {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 110;
      cursor: pointer;
    }

    .logo-id {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      border: 2px solid rgba(255, 255, 255, 0.4);
      display: block;
    }

    .logo-popup {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      padding: 0.5rem 0.9rem;
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 0.95rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
      pointer-events: none;
    }

    .logo-popup::before {
      content: '';
      position: absolute;
      bottom: 100%;
      left: 16px;
      border: 6px solid transparent;
      border-bottom-color: rgba(255, 255, 255, 0.95);
    }

    .logo-popup.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* 星空点点 */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .stars span {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.4;
      animation: twinkle 3s ease-in-out infinite;
    }

    .stars span:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .stars span:nth-child(2) { left: 25%; top: 15%; animation-delay: 0.5s; }
    .stars span:nth-child(3) { left: 40%; top: 25%; animation-delay: 1s; }
    .stars span:nth-child(4) { left: 60%; top: 10%; animation-delay: 0.3s; }
    .stars span:nth-child(5) { left: 75%; top: 22%; animation-delay: 1.2s; }
    .stars span:nth-child(6) { left: 90%; top: 18%; animation-delay: 0.8s; }
    .stars span:nth-child(7) { left: 15%; top: 60%; animation-delay: 0.2s; }
    .stars span:nth-child(8) { left: 85%; top: 55%; animation-delay: 1.5s; }
    .stars span:nth-child(9) { left: 50%; top: 80%; animation-delay: 0.6s; }
    .stars span:nth-child(10) { left: 30%; top: 70%; animation-delay: 1s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.2); }
    }

    /* ========== 开场：初始页可拖动背景，门口热区随图移动 ========== */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #1a1625;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* 可拖动视口：只显示此区域，内容可被平移；禁止长按选中等，避免拖久出现蓝屏选区 */
    .intro-pan {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .intro-pan.dragging { cursor: grabbing; }

    /* 可拖动层：尺寸由 JS 按 cover 计算，保证整图可拖览且不露空白 */
    .intro-pan-content {
      position: absolute;
      left: 0;
      top: 0;
      image-rendering: auto;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transition: filter 1s ease, transform 1s ease;
      will-change: transform;
      transform: translate(var(--intro-dx, 0), var(--intro-dy, 0));
    }
    /* 拖拽时关闭位移过渡，否则拖起来很沉 */
    .intro-pan.dragging .intro-pan-content {
      transition: filter 1s ease;
    }
    .intro-pan-content .pan-bg-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }
    .intro-pan-handle {
      position: absolute;
      inset: 0;
      z-index: 0;
      cursor: grab;
    }
    .intro-pan.dragging .intro-pan-handle { cursor: grabbing; }
    /* 仅点击门口后、淡出时临时虚化 */
    .intro.blurring .intro-pan-content {
      filter: blur(12px);
      transform: translate(var(--intro-dx, 0), var(--intro-dy, 0)) scale(1.08);
    }

    .intro.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    /* 门口可点击区域：位置与大小由 :root 的 --door-* 控制，勿改下面 fallback */
    .door-hotspot {
      position: absolute;
      top: var(--door-top, 38%);
      left: var(--door-left, 30%);
      width: var(--door-width, 18%);
      height: var(--door-height, 43%);
      cursor: pointer;
      z-index: 1;
    }

    .door-bubble {
      position: absolute;
      top: 0;
      right: 0;
      transform: translateY(-100%) translateX(0);
      margin-top: -8px;
      margin-right: -4px;
      padding: 0.45rem 0.75rem;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 0.85rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      pointer-events: none;
    }

    .door-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 12px;
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.5);
    }

    /* ========== 房间视图：可拖动背景，信封热区随图移动 ========== */
    .room-view {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #1a1625;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .room-view.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .room-pan {
      position: absolute;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .room-pan.dragging { cursor: grabbing; }

    .room-pan-content {
      position: absolute;
      left: 0;
      top: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: transform;
      transform: translate(var(--room-dx, 0), var(--room-dy, 0));
    }
    .room-pan-content .pan-bg-img {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      z-index: 0;
    }
    .room-pan-handle {
      position: absolute;
      inset: 0;
      z-index: 0;
      cursor: grab;
    }
    .room-pan.dragging .room-pan-handle { cursor: grabbing; }

    /* 信封可点击区域：位置与大小由 :root 的 --env-* 控制，勿改下面 fallback */
    .envelope-hotspot {
      position: absolute;
      top: var(--env-top, 85%);
      left: var(--env-left, 25%);
      width: var(--env-width, 20%);
      height: var(--env-height, 10%);
      cursor: pointer;
      z-index: 1;
    }

    /* 虚线框右上角气泡提示 */
    .envelope-bubble {
      position: absolute;
      top: -10px;
      right: -10px;
      transform: translateY(-100%) translateX(0);
      margin-top: -8px;
      margin-right: -4px;
      padding: 0.45rem 0.75rem;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 0.85rem;
      color: var(--text);
      background: rgba(244, 230, 181, 0.96);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
      pointer-events: none;
    }

    .envelope-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      right: 12px;
      border: 6px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.96);
    }

    /* 「转到室外」：固定在视口右下角，不随背景拖动 */
    .btn-outdoor {
      position: fixed;
      bottom: 5rem;
      right: 1.5rem;
      z-index: 60;
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 0.9rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid rgba(254, 212, 95, 0.5);
      border-radius: 999px;
      background: rgba(221, 187, 106, 0.694);
      color: rgba(255, 255, 255, 0.95);
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn-outdoor:hover {
      transform: scale(1.04);
      background: rgba(255, 255, 255, 0.4);   
      border-color: rgba(255, 255, 255, 0.75);
    }

    /* ========== 主区域：点击虚线框内即缓慢展开信件 ========== */
    .page {
      max-width: 520px;
      width: 100%;
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: scale(0.88) translateY(24px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .page.visible {
      opacity: 1;
      transform: scale(1) translateY(0);
    }

    .card {
      font-family: 'Ma Shan Zheng', 'Zhi Mang Xing', cursive;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px var(--shadow), 0 0 0 1px rgba(232, 180, 184, 0.15);
      padding: clamp(2rem, 5vw, 3rem);
      position: relative;
      overflow: visible;
      transition: box-shadow 0.3s ease;
    }

    .card .choice-btn,
    .card .btn-magic,
    .card .btn-back {
      font-family: 'Ma Shan Zheng', 'Zhi Mang Xing', cursive;
    }

    .card:hover {
      box-shadow: 0 24px 64px var(--shadow), 0 0 0 1px rgba(232, 180, 184, 0.2);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 0 0 4px 4px;
    }

    .title {
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      color: var(--text);
      text-align: center;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    /* ========== 分支选择（Zhi Mang Xing）========== */
    .choice-section {
      margin-bottom: 1.5rem;
    }

    .choice-label {
      font-size: 0.95rem;
      color: var(--text-soft);
      margin-bottom: 0.6rem;
      display: block;
    }

    .choice-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .choice-btn {
      font-size: 0.9rem;
      padding: 0.45rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: rgba(232, 180, 184, 0.15);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .choice-btn:hover {
      background: rgba(232, 180, 184, 0.3);
      transform: scale(1.03);
    }

    .choice-btn.chosen {
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      border-color: transparent;
    }

    .choice-reply {
      margin-top: 0.8rem;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.7;
      min-height: 1.6em;
    }

    .choice-reply .reply-text {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .choice-reply .reply-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ========== 信件正文：逐行淡入（Ma Shan Zheng）========== */
    .letter {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px dashed rgba(180, 140, 140, 0.25);
    }

    .letter-line {
      font-size: 1rem;
      line-height: 2;
      color: var(--text);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .letter-line.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .letter-line .handwritten {
      font-size: 1.15em;
    }

    /* ========== 惊喜按钮：会躲鼠标 + 点击惊喜 ========== */
    .action-wrap {
      text-align: center;
      margin-top: 1.8rem;
      position: relative;
    }

    .btn-magic {
      font-size: 1rem;
      padding: 0.7rem 1.8rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 160, 165, 0.35);
      transition: box-shadow 0.2s ease, transform 0.15s ease;
      position: relative;
      z-index: 2;
    }

    .btn-magic:hover {
      box-shadow: 0 8px 24px rgba(212, 160, 165, 0.45);
    }

    .btn-magic:active {
      transform: scale(0.97);
    }

    /* ========== 背景音乐：与标识同大的圆形旋钮，悬停展开文字 ========== */
    .music-fixed {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 110;
    }

    .btn-music {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-radius: 50%;
      background: #fff;
      color: #5a5550;
      cursor: pointer;
      transition: width 0.3s ease, padding 0.3s ease, border-radius 0.3s ease, background 0.25s ease, border-color 0.25s ease;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      gap: 8px;
    }

    .btn-music:hover {
      width: auto;
      padding-left: 14px;
      padding-right: 14px;
      border-radius: 999px;
      border-color: rgba(0, 0, 0, 0.12);
    }

    .btn-music.playing {
      background: rgba(232, 180, 184, 0.85);
      border-color: rgba(255, 255, 255, 0.5);
      color: #fff;
    }

    .btn-music-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.35rem;
      transition: transform 0.25s ease;
    }

    .btn-music.playing .btn-music-icon {
      animation: musicSpin 2.5s linear infinite;
    }

    @keyframes musicSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .btn-music-text {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 0.8rem;
      white-space: nowrap;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.3s ease, opacity 0.25s ease;
    }

    .btn-music:hover .btn-music-text {
      max-width: 10em;
      opacity: 1;
    }

    .back-wrap {
      text-align: center;
      margin-top: 1rem;
    }

    .btn-back {
      font-size: 0.9rem;
      padding: 0.5rem 1.2rem;
      border: 1px solid var(--text-soft);
      border-radius: 999px;
      background: transparent;
      color: var(--text-soft);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .btn-back:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(232, 180, 184, 0.12);
    }

    /* ========== 隐藏彩蛋：初始不可见，点击后出现 ========== */
    .egg-trigger {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.25);
      transition: background 0.2s, color 0.2s;
      user-select: none;
    }

    .egg-trigger:hover {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.5);
    }

    .egg-popup {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .egg-popup.show {
      opacity: 1;
      visibility: visible;
    }

    .egg-content {
      font-family: 'ZCOOL KuaiLe', cursive;
      font-size: 1.3rem;
      color: #fff;
      text-align: center;
      padding: 2rem;
      max-width: 280px;
      background: linear-gradient(145deg, #3d3555 0%, #2d2440 100%);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      transform: scale(0.8);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .egg-popup.show .egg-content {
      transform: scale(1);
      opacity: 1;
    }

    .egg-content .egg-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.5rem;
      animation: eggBounce 0.6s ease;
    }

    @keyframes eggBounce {
      0% { transform: scale(0); }
      60% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .egg-close {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    /* ========== 飘心层 ========== */
    .hearts-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 1.2rem;
      opacity: 0;
      animation: heartRise 2s ease-out forwards;
    }

    @keyframes heartRise {
      0% { opacity: 0.9; transform: translateY(0) scale(0.6); }
      100% { opacity: 0; transform: translateY(-120px) scale(1); }
    }

    /* ========== 底部 ========== */
    .footer-note {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-soft);
    }

    .footer-note span {
      display: inline-block;
      margin: 0 0.2rem;
      animation: pulse 2s ease-in-out infinite;
    }

    .footer-note span:nth-child(1) { animation-delay: 0s; }
    .footer-note span:nth-child(2) { animation-delay: 0.3s; }
    .footer-note span:nth-child(3) { animation-delay: 0.6s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }

    .font-note {
      margin-top: 0.6rem;
      font-size: 0.7rem;
      color: rgba(122, 117, 111, 0.6);
      text-align: center;
    }

    @media (max-width: 480px) {
      .card { padding: 1.75rem 1.5rem; }
      .letter-line { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap" id="logoWrap">
    <img src="1.jpg" alt="我的标识" class="logo-id">
    <div class="logo-popup" id="logoPopup">嘻嘻，我在</div>
  </div>

  <div class="music-fixed">
    <button type="button" class="btn-music" id="btnMusic" title="打开或关闭背景音乐">
      <span class="btn-music-icon" aria-hidden="true">🎵</span>
      <span class="btn-music-text" id="btnMusicText">打开背景音乐</span>
    </button>
  </div>

  <!-- 星空背景 -->
  <div class="stars" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="intro" id="intro">
    <div class="intro-pan" id="introPan">
      <div class="intro-pan-content" id="introPanContent">
        <img src="bg.jpg" alt="" class="pan-bg-img" id="introPanImg">
        <div class="intro-pan-handle" id="introPanHandle" aria-hidden="true"></div>
        <div class="door-hotspot" id="doorHotspot">
          <span class="door-bubble">点击门口探索小屋</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 房间视图：可拖动 bg2，信封热区随图；转到室外固定右下角 -->
  <div class="room-view hidden" id="roomView">
    <div class="room-pan" id="roomPan">
      <div class="room-pan-content" id="roomPanContent">
        <img src="bg2.jpg" alt="" class="pan-bg-img" id="roomPanImg">
        <div class="room-pan-handle" id="roomPanHandle" aria-hidden="true"></div>
        <div class="envelope-hotspot" id="envelopeHotspot">
          <span class="envelope-bubble">点击信封展开信件</span>
        </div>
      </div>
    </div>
    <button type="button" class="btn-outdoor" id="btnOutdoor">转到室外</button>
  </div>

  <div class="hearts-layer" id="heartsLayer"></div>

  <!-- 隐藏彩蛋触发点 -->
  <div class="egg-trigger" id="eggTrigger" title="点看看">··</div>
  <div class="egg-popup" id="eggPopup">
    <div class="egg-content">
      <span class="egg-emoji">🎉</span>
      你发现了彩蛋！<br>愿你永远被温柔以待，天天开心～
      <p class="egg-close" id="eggClose">点击任意处关闭</p>
    </div>
  </div>

  <main class="page" id="mainPage">
    <article class="card" id="card">
      <h1 class="title">给你的小纸条 ✨</h1>

      <!-- 分支选择 -->
      <div class="choice-section">
        <span class="choice-label">今天心情怎么样？</span>
        <div class="choice-btns">
          <button type="button" class="choice-btn" data-choice="good">很好呀</button>
          <button type="button" class="choice-btn" data-choice="ok">一般般</button>
          <button type="button" class="choice-btn" data-choice="tired">有点累</button>
        </div>
        <div class="choice-reply">
          <span class="reply-text" id="replyText"></span>
        </div>
      </div>

      <!-- 信件正文：逐行淡入，可自定义内容 -->
      <div class="letter">
        <p class="letter-line" data-delay="0"><span class="handwritten">亲爱的你，</span></p>
        <p class="letter-line" data-delay="1">早上好、中午好、下午好、晚上好。</p>
        <p class="letter-line" data-delay="2">希望你在平凡的日子里，也能常常发现小确幸。</p>
        <p class="letter-line" data-delay="3">累了就休息，开心就大笑，永远有人站在你这边。</p>
        <p class="letter-line" data-delay="4">祝你今天开心，明天开心，天天都开心～</p>
        <p class="letter-line" data-delay="5"><span class="handwritten">—— 一直为你加油的人</span></p>
      </div>

      <div class="action-wrap">
        <button type="button" class="btn-magic" id="btnMagic">点我有小心心</button>
      </div>

      <div class="back-wrap">
        <button type="button" class="btn-back" id="btnBack">返回</button>
      </div>

      <p class="footer-note">
        <span>❤</span><span>️</span><span>❤️</span>
      </p>
    </article>
  </main>

  <!-- 音乐： src ：文件路径-->
  <audio id="bgMusic" loop>
    <source src="mixkit-hip-hop-02-738.mp3" type="audio/mpeg">
  </audio>

  <script>
    (function () {
      var intro = document.getElementById('intro');
      var mainPage = document.getElementById('mainPage');
      var card = document.getElementById('card');
      var btnMagic = document.getElementById('btnMagic');
      var heartsLayer = document.getElementById('heartsLayer');
      var hearts = ['❤️', '💕', '💗', '💖', '🌸', '✨'];

      // 点击门口虚线框：进入房间视图（bg2.jpg 清晰）
      var roomView = document.getElementById('roomView');
      var envelopeHotspot = document.getElementById('envelopeHotspot');
      var doorHotspot = document.getElementById('doorHotspot');
      var introPan = document.getElementById('introPan');
      var introPanContent = document.getElementById('introPanContent');
      var roomPan = document.getElementById('roomPan');
      var roomPanContent = document.getElementById('roomPanContent');

      /**
       * 按 cover 规则计算内容尺寸，使整图可被拖拽浏览；拖拽范围限制在内容与视口内，不露空白。
       * handleEl = 仅在此层按下时开始拖拽（门口/信封在上一层，点它们不会触发拖拽）；panEl 用于 capture 和 dragging 样式
       */
      function makePannable(panEl, handleEl, contentEl, imgEl, dxKey, dyKey) {
        var pos = { dx: 0, dy: 0 };
        var start = { x: 0, y: 0, dx: 0, dy: 0 };
        var bounds = { minTx: 0, maxTx: 0, minTy: 0, maxTy: 0 };

        function getBounds() {
          var vw = panEl.clientWidth;
          var vh = panEl.clientHeight;
          var nw = imgEl.naturalWidth;
          var nh = imgEl.naturalHeight;
          if (!nw || !nh) return { minTx: 0, maxTx: 0, minTy: 0, maxTy: 0 };
          var contentW = Math.max(vw, vh * nw / nh);
          var contentH = Math.max(vh, vw * nh / nw);
          contentEl.style.width = contentW + 'px';
          contentEl.style.height = contentH + 'px';
          return {
            minTx: vw - contentW,
            maxTx: 0,
            minTy: vh - contentH,
            maxTy: 0
          };
        }

        function updateBoundsAndClamp() {
          bounds = getBounds();
          pos.dx = Math.max(bounds.minTx, Math.min(bounds.maxTx, pos.dx));
          pos.dy = Math.max(bounds.minTy, Math.min(bounds.maxTy, pos.dy));
          applyTransform();
        }

        function applyTransform() {
          contentEl.style.setProperty(dxKey, pos.dx + 'px');
          contentEl.style.setProperty(dyKey, pos.dy + 'px');
        }

        function onPointerDown(e) {
          if (e.button !== undefined && e.button !== 0) return;
          e.preventDefault();
          panEl.classList.add('dragging');
          start.x = e.clientX;
          start.y = e.clientY;
          start.dx = pos.dx;
          start.dy = pos.dy;
          if (e.pointerId !== undefined) {
            try { panEl.setPointerCapture(e.pointerId); } catch (_) {}
          }
          document.addEventListener('pointermove', onPointerMove);
          document.addEventListener('pointerup', onPointerUp);
          document.addEventListener('pointercancel', onPointerUp);
        }
        function onPointerMove(e) {
          var dx = e.clientX - start.x;
          var dy = e.clientY - start.y;
          pos.dx = Math.max(bounds.minTx, Math.min(bounds.maxTx, start.dx + dx));
          pos.dy = Math.max(bounds.minTy, Math.min(bounds.maxTy, start.dy + dy));
          applyTransform();
        }
        function onPointerUp(e) {
          if (e && e.pointerId !== undefined) {
            try { panEl.releasePointerCapture(e.pointerId); } catch (_) {}
          }
          panEl.classList.remove('dragging');
          document.removeEventListener('pointermove', onPointerMove);
          document.removeEventListener('pointerup', onPointerUp);
          document.removeEventListener('pointercancel', onPointerUp);
        }

        if (imgEl.complete && imgEl.naturalWidth) {
          updateBoundsAndClamp();
        } else {
          imgEl.addEventListener('load', updateBoundsAndClamp);
        }
        window.addEventListener('resize', updateBoundsAndClamp);
        handleEl.addEventListener('pointerdown', onPointerDown);
      }

      makePannable(introPan, document.getElementById('introPanHandle'), introPanContent, document.getElementById('introPanImg'), '--intro-dx', '--intro-dy');
      makePannable(roomPan, document.getElementById('roomPanHandle'), roomPanContent, document.getElementById('roomPanImg'), '--room-dx', '--room-dy');

      doorHotspot.addEventListener('click', function () {
        intro.classList.add('blurring', 'hidden');
        roomView.classList.remove('hidden');
        setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 80);
      });

      envelopeHotspot.addEventListener('click', function () {
        document.body.classList.add('bg2-blur');
        roomView.classList.add('hidden');
        mainPage.classList.add('visible');
        setTimeout(function () {
          startLetterReveal();
        }, 600);
      });

      // 信件页「返回」：回到 bg2 房间，可重新点击信封展开
      var btnBack = document.getElementById('btnBack');
      btnBack.addEventListener('click', function () {
        document.body.classList.remove('bg2-blur');
        mainPage.classList.remove('visible');
        roomView.classList.remove('hidden');
        document.querySelectorAll('.letter-line').forEach(function (line) {
          line.classList.remove('visible');
        });
        document.querySelectorAll('.choice-btn').forEach(function (btn) {
          btn.classList.remove('chosen');
        });
        var replyText = document.getElementById('replyText');
        if (replyText) { replyText.textContent = ''; replyText.classList.remove('show'); }
      });

      // 房间内「转到室外」：回到初始界面（bg.jpg + 探索小屋）
      var btnOutdoor = document.getElementById('btnOutdoor');
      btnOutdoor.addEventListener('click', function () {
        intro.classList.remove('blurring', 'hidden');
        roomView.classList.add('hidden');
      });

      function startLetterReveal() {
        var lines = document.querySelectorAll('.letter-line');
        lines.forEach(function (line) {
          var delay = parseInt(line.getAttribute('data-delay') || 0, 10) * 520;
          setTimeout(function () {
            line.classList.add('visible');
          }, 300 + delay);
        });
      }

      //  隐藏彩蛋
      var eggTrigger = document.getElementById('eggTrigger');
      var eggPopup = document.getElementById('eggPopup');
      var eggClose = document.getElementById('eggClose');

      eggTrigger.addEventListener('click', function () {
        eggPopup.classList.add('show');
      });

      function closeEgg() {
        eggPopup.classList.remove('show');
      }

      eggClose.addEventListener('click', closeEgg);
      eggPopup.addEventListener('click', function (e) {
        if (e.target === eggPopup) closeEgg();
      });

      // 左上角标识
      var logoWrap = document.getElementById('logoWrap');
      var logoPopup = document.getElementById('logoPopup');

      logoWrap.addEventListener('click', function (e) {
        e.stopPropagation();
        logoPopup.classList.toggle('show');
      });

      document.addEventListener('click', function (e) {
        if (!logoWrap.contains(e.target)) {
          logoPopup.classList.remove('show');
        }
      });

      // 按钮躲鼠标 + 点击惊喜
      var btnRect = { w: 0, h: 0, cx: 0, cy: 0 };
      var runRadius = 80;
      var maxMove = 28;

      function updateBtnRect() {
        var r = btnMagic.getBoundingClientRect();
        btnRect.w = r.width;
        btnRect.h = r.height;
        btnRect.cx = r.left + r.width / 2;
        btnRect.cy = r.top + r.height / 2;
      }

      document.addEventListener('mousemove', function (e) {
        updateBtnRect();
        var dx = e.clientX - btnRect.cx;
        var dy = e.clientY - btnRect.cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < runRadius) {
          var angle = Math.atan2(dy, dx);
          var push = (1 - dist / runRadius) * maxMove;
          var tx = -Math.cos(angle) * push;
          var ty = -Math.sin(angle) * push;
          btnMagic.style.transform = 'translate(' + tx + 'px, ' + ty + 'px)';
        } else {
          btnMagic.style.transform = '';
        }
      });

      function createHeart(x, y) {
        var el = document.createElement('span');
        el.className = 'heart';
        el.textContent = hearts[Math.floor(Math.random() * hearts.length)];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        heartsLayer.appendChild(el);
        setTimeout(function () { el.remove(); }, 2100);
      }

      function onMagicClick(e) {
        var x = (e.clientX || (e.touches && e.touches[0] && e.touches[0].clientX)) || 0;
        var y = (e.clientY || (e.touches && e.touches[0] && e.touches[0].clientY)) || 0;
        for (var i = 0; i < 10; i++) {
          (function (ix, iy) {
            setTimeout(function () {
              createHeart(ix + (Math.random() - 0.5) * 60, iy);
            }, i * 60);
          })(x, y);
        }
      }

      btnMagic.addEventListener('click', onMagicClick);

      // 分支选择
      var choiceBtns = document.querySelectorAll('.choice-btn');
      var replyText = document.getElementById('replyText');
      var replies = {
        good: '那就继续保持～ 你笑起来最好看。',
        ok: '抱抱你，明天会更好的。',
        tired: '休息一下，你值得被温柔以待。'
      };

      choiceBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          choiceBtns.forEach(function (b) { b.classList.remove('chosen'); });
          btn.classList.add('chosen');
          var key = btn.getAttribute('data-choice');
          var text = replies[key] || '';
          replyText.textContent = text;
          replyText.classList.remove('show');
          requestAnimationFrame(function () {
            replyText.classList.add('show');
          });
        });
      });

      // 背景音乐（默认关闭，点击播放）
      var bgMusic = document.getElementById('bgMusic');
      var btnMusic = document.getElementById('btnMusic');

      var btnMusicText = document.getElementById('btnMusicText');
      btnMusic.addEventListener('click', function () {
        if (bgMusic.paused) {
          bgMusic.play().catch(function () {
            console.log('请放入音乐文件并设置 audio 的 src');
          });
          btnMusic.classList.add('playing');
          if (btnMusicText) btnMusicText.textContent = '关闭背景音乐';
        } else {
          bgMusic.pause();
          btnMusic.classList.remove('playing');
          if (btnMusicText) btnMusicText.textContent = '打开背景音乐';
        }
      });
    })();
  </script>
</body>
</html>
