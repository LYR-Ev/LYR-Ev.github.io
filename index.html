<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>惊喜盒子</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }

    /* 页面周围装饰 */
    .deco {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .deco span {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.85;
      animation: float 4s ease-in-out infinite;
    }

    .deco .d1 { top: 12%; left: 8%; animation-delay: 0s; }
    .deco .d2 { top: 18%; right: 10%; animation-delay: 0.5s; font-size: 1.4rem; }
    .deco .d3 { top: 45%; left: 5%; animation-delay: 1s; font-size: 1.2rem; }
    .deco .d4 { top: 50%; right: 6%; animation-delay: 1.5s; }
    .deco .d5 { bottom: 25%; left: 12%; animation-delay: 0.3s; font-size: 1.5rem; }
    .deco .d6 { bottom: 20%; right: 15%; animation-delay: 0.8s; }
    .deco .d7 { top: 8%; left: 25%; animation-delay: 1.2s; font-size: 1.3rem; }
    .deco .d8 { top: 35%; right: 8%; animation-delay: 0.2s; }
    .deco .d9 { bottom: 35%; left: 8%; animation-delay: 1.8s; font-size: 1.4rem; }
    .deco .d10 { bottom: 15%; right: 25%; animation-delay: 0.6s; }
    .deco .d11 { top: 22%; left: 15%; animation-delay: 2s; font-size: 1.1rem; }
    .deco .d12 { bottom: 40%; right: 12%; animation-delay: 1.3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
    }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      padding: 3rem 4rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      text-align: center;
      max-width: 420px;
      animation: cardIn 0.6s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      font-size: 1.2rem;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .btn-yes {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-no {
      background: linear-gradient(135deg, #95a5a6, #7f8c8d);
      color: white;
    }

    .sad-result {
      display: none;
      margin-top: 1.5rem;
      font-size: 4rem;
      animation: sadIn 0.5s ease-out;
    }

    .sad-result.show {
      display: block;
    }

    @keyframes sadIn {
      from {
        opacity: 0;
        transform: scale(0.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .sad-text {
      font-size: 1rem;
      color: #666;
      margin-top: 0.5rem;
    }

    .choices {
      display: block;
    }

    .choices.hide {
      display: none;
    }

    .back-btn {
      display: inline-block;
      margin-top: 1rem;
      font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
      font-size: 1rem;
      padding: 0.6rem 1.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body>
  <div class="deco" aria-hidden="true">
    <span class="d1">✨</span>
    <span class="d2">🎀</span>
    <span class="d3">💝</span>
    <span class="d4">✨</span>
    <span class="d5">🎀</span>
    <span class="d6">💝</span>
    <span class="d7">⭐</span>
    <span class="d8">✨</span>
    <span class="d9">🎀</span>
    <span class="d10">⭐</span>
    <span class="d11">💝</span>
    <span class="d12">✨</span>
  </div>
  <div class="card">
    <div class="choices" id="choices">
      <h1>是否打开你的惊喜盒子？</h1>
      <div class="buttons">
        <button class="btn btn-yes" id="btnYes">是</button>
        <button class="btn btn-no" id="btnNo">否</button>
      </div>
    </div>
    <div class="sad-result" id="sadResult">
      <span aria-hidden="true">😢</span>
      <p class="sad-text">好遗憾呀～</p>
      <a href="index.html" class="back-btn">返回</a>
    </div>
  </div>

  <script>
    document.getElementById('btnYes').addEventListener('click', function () {
      window.location.href = 'gift.html';
    });

    document.getElementById('btnNo').addEventListener('click', function () {
      document.getElementById('choices').classList.add('hide');
      document.getElementById('sadResult').classList.add('show');
    });
  </script>
</body>
</html>
